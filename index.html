<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Алдияр Әбілхан (entryvelostition) — информационная безопасность и CTF. Результаты соревнований, сертификаты, навыки.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="entryvelostition">
<meta property="og:title" content="Алдияр Әбілхан — ИБ · CTF">
<meta property="og:description" content="Информационная безопасность, CTF, саморазвитие. Результаты, сертификаты, навыки.">
<meta property="og:url" content="https://entryvelostition.github.io/">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#00674f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="intro">
    <p class="eyebrow">portfolio</p>
    <h1><span class="nick" id="nick">Алдияр Әбілхан</span><span class="tw-cursor" id="twcur"></span></h1>
    <p class="role" id="role"></p>
    <p class="tagline" id="tagline"></p>
    <div class="cta">
      <a href="certs.html" class="btn" data-i18n="home.certs">Сертификаты</a>
      <a href="ctf.html" class="btn" data-i18n="home.ctf">CTF</a>
      <a href="bio.html" class="btn" data-i18n="home.bio">О себе</a>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <section>
    <h2 class="block-h" data-i18n="home.highlights">основные достижения</h2>
    <div class="highlights" id="highlights"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
buildChrome("home");
document.getElementById("role").textContent = L(PROFILE, "role");
document.getElementById("highlights").innerHTML = HIGHLIGHTS.map(h=>`
  <div class="hl"><div class="t">${L(h,"title")}</div><div class="n">${L(h,"note")}</div></div>`).join("");

// --- цифры-достижения (считаются автоматически из data.js) ---
const played = CTF.filter(c => ctfPct(c));
let best = null;
played.forEach(c => {
  const p = ctfPct(c).pct;
  if (best === null || p < best.pct) best = { pct: p, event: L(c, "event") };
});
const stats = [
  { num: played.length,  label: t("stat.played") },
  { num: CERTS.length,   label: t("stat.certs") },
  ...(best ? [{ num: t("top") + " " + best.pct + "%", label: t("stat.best"), sub: best.event }] : []),
];
document.getElementById("stats").innerHTML = stats.map(s=>`
  <div class="stat">
    <div class="stat-num">${s.num}</div>
    <div class="stat-label">${s.label}</div>
    ${s.sub ? `<div class="stat-sub">${s.sub}</div>` : ""}
  </div>`).join("");

// --- typewriter: печатаем имя, затем tagline по очереди ---
const nickEl = document.getElementById("nick");
const tagEl  = document.getElementById("tagline");
const curEl  = document.getElementById("twcur");
const NAME = L(PROFILE, "name") || PROFILE.nick;
const TAG  = L(PROFILE, "tagline") || "";
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function typeText(el, txt, speed, done){
  let i = 0;
  (function step(){
    if(i <= txt.length){ el.textContent = txt.slice(0, i++); setTimeout(step, speed); }
    else if(done) done();
  })();
}

if(reduceMotion){
  nickEl.textContent = NAME;
  tagEl.textContent  = TAG;
  if(curEl) curEl.style.display = "none";
} else {
  nickEl.textContent = "";
  tagEl.textContent  = "";
  typeText(nickEl, NAME, 80, ()=>{
    setTimeout(()=>typeText(tagEl, TAG, 30, ()=>{
      if(curEl) curEl.style.display = "none";
    }), 400);
  });
}

// --- анимация появления при скролле ---
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll(".stat, .hl, .block-h").forEach((el,i)=>{
  el.classList.add("reveal");
  el.style.transitionDelay = (i * 60) + "ms";
  io.observe(el);
});
</script>
</body>
</html>
