<script>

      <span class="skill-cat-name">${L(cat,"label")}</span>
      <span class="skill-cat-count">${cat.tags.length}</span>
    </div>
    <div class="skill-tags">
      ${cat.tags.map(x=>`<span class="skill-tag">${x}</span>`).join("")}
    </div>
  </div>`).join("");
