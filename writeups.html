<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Райтапы — m0rbidmask</title>
<meta name="description" content="Разборы задач с CTF-соревнований: web, crypto, reverse, pwn, forensics.">
<meta property="og:type" content="website">
<meta property="og:title" content="Райтапы — Алдияр Әбілхан">
<meta property="og:description" content="Разборы задач с CTF-соревнований.">
<meta property="og:url" content="https://entryvelostition.github.io/writeups.html">
<meta property="og:image" content="https://entryvelostition.github.io/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#00674f">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="eyebrow">writeups</p>
  <h1 class="page-title" data-i18n="wu.title">Райтапы</h1>
  <p class="page-sub" data-i18n="wu.sub">Разборы задач с CTF.</p>
  <div class="chips" id="chips"></div>
  <div class="wu-list" id="list"></div>
</main>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
buildChrome("writeups");
const listEl = document.getElementById("list");
const chips = document.getElementById("chips");
const all = byDateDesc(WRITEUPS);
let cat = "all";

function render(){
  const list = cat === "all" ? all : all.filter(w => w.cat === cat);
  if (!all.length) { listEl.innerHTML = `<p class="empty-note">${t("wu.empty")}</p>`; return; }
  listEl.innerHTML = list.map(w => `
    <a class="wu-card" href="writeup.html?id=${encodeURIComponent(w.id)}">
      <div class="wu-meta">
        ${w.cat ? `<span class="wu-cat">${w.cat}</span>` : ""}
        <span>${w.ctf || ""}</span>
        <span class="wu-date">${fmtDate(w)}</span>
      </div>
      <h3>${L(w, "title")}</h3>
      ${w.summary ? `<p>${L(w, "summary")}</p>` : ""}
      <div class="wu-foot">
        <span class="row-tags">${(w.tags || []).map(g => `<i>${g}</i>`).join("")}</span>
        <span class="wu-read">${t("wu.read")}</span>
      </div>
    </a>`).join("");
}

const cats = [...new Set(all.map(w => w.cat).filter(Boolean))];
if (cats.length > 1) {
  chips.innerHTML = ["all", ...cats].map(c => `<button type="button" class="chip ${c==='all'?'on':''}" data-c="${c}">${c==='all'?t("wu.all"):c}</button>`).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    cat = b.dataset.c;
    [...chips.children].forEach(x => x.classList.toggle("on", x.dataset.c === cat));
    render();
  });
}
render();
</script>
</body>
</html>
